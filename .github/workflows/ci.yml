name: CI / Release

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3)"
        required: true
        type: string
      minAppVersion:
        description: "Obsidian minAppVersion (leave blank to keep the current one)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npx tsc --noEmit

      - name: tests
        run: npm test

      - name: production build
        run: npm run build

  provenance:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4
        with:
          # A real branch ref (not the detached commit workflow_dispatch
          # normally checks out) so the version-bump commit below has
          # something to push to.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: bump manifest / package / versions / release.mjs together
        run: node scripts/bump-version.mjs "${{ inputs.version }}" "${{ inputs.minAppVersion }}"

      - name: commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json package.json package-lock.json versions.json scripts/release.mjs
          git commit -m "chore: release v${{ inputs.version }}"
          git push origin HEAD:${{ github.ref_name }}

      - name: typecheck (post-bump)
        run: npx tsc --noEmit

      - name: tests (post-bump)
        run: npm test

      - name: package release assets
        run: npm run release

      - name: upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: handwriting-release-${{ inputs.version }}
          path: |
            release/main.js
            release/manifest.json
            release/styles.css
          if-no-files-found: error

      - name: attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            release/main.js
            release/manifest.json
            release/styles.css

      - name: create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          files: |
            release/main.js
            release/manifest.json
            release/styles.css
